<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Text Commonwealth Joe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Zilla+Slab:wght@700&display=swap">
<style>
  :root{--navy:#252239;--tan:#B39671;--cream:#F9F7F0;--gray:#DEDBD7;--brown:#81361A}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--navy);color:var(--cream);font-family:Poppins,'Segoe UI',Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 20px}
  main{max-width:440px;width:100%;display:flex;flex-direction:column;gap:18px}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--tan)}
  h1{font-family:'Zilla Slab',Georgia,serif;font-size:34px;line-height:1.1;margin:0}
  p{margin:0;color:var(--gray);font-size:15px;line-height:1.45}
  .msg{background:var(--cream);color:var(--navy);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.45}
  a.go{display:block;text-align:center;background:var(--brown);color:var(--cream);text-decoration:none;font-weight:700;font-size:18px;padding:16px;border-radius:10px}
  a.go:focus-visible{outline:3px solid var(--tan);outline-offset:2px}
  .alt{font-size:13px;color:var(--gray)}
  .alt a{color:var(--tan)}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Commonwealth Joe · Free bag-in-box</div>
  <h1>Opening your messages…</h1>
  <p>Your text is ready to go. Just hit send and we will be in touch to confirm the box fits your dispenser.</p>
  <div class="msg" id="msg"></div>
  <a class="go" id="go" href="#">Text us now</a>
  <p class="alt">Prefer a form? <a href="./">Claim your box here</a>.</p>
</main>
<script>
(function(){
  // Production number goes here once the Google Voice line exists. A ?to= value overrides it for testing.
  var DEFAULT_TO = '';
  var q = new URLSearchParams(location.search);
  var to = (q.get('to') || DEFAULT_TO).replace(/[^\d+]/g,'');
  var shop = (q.get('shop') || '').trim();
  var ref = (q.get('ref') || '').trim();
  var tag = [shop, ref].filter(Boolean).join(' · ');
  var body = 'Hi! I got the Commonwealth Joe postcard and would like my free bag-in-box.' + (tag ? ' (' + tag + ')' : '');
  document.getElementById('msg').textContent = body;
  if (!to) { document.getElementById('go').style.display = 'none'; return; }
  if (to.charAt(0) !== '+' && to.length === 10) to = '+1' + to;
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var href = 'sms:' + to + (ios ? '&' : '?') + 'body=' + encodeURIComponent(body);
  var go = document.getElementById('go'); go.href = href;
  setTimeout(function(){ location.href = href; }, 400);
})();
</script>
</body>
</html>
